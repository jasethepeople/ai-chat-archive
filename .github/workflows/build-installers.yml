name: Build desktop installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust-targets: ''
            tauri-args: ''
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run import regression tests
        run: npm test

      - name: Build Tauri bundles
        shell: bash
        run: npm run desktop:build -- ${{ matrix.tauri-args }}

      - name: Verify expected installer formats
        shell: bash
        run: |
          set -euo pipefail
          target_root="src-tauri/target"

          require_bundle() {
            local label="$1"
            local file_type="$2"
            local pattern="$3"
            local match
            match=$(find "$target_root" -type "$file_type" -path "$pattern" -print -quit)
            if [[ -z "$match" ]]; then
              echo "::error::Missing expected $label bundle matching $pattern"
              exit 1
            fi
            echo "Verified $label: $match"
          }

          case "$RUNNER_OS" in
            Windows)
              require_bundle "Windows MSI" f '*/release/bundle/msi/*.msi'
              require_bundle "Windows NSIS setup EXE" f '*/release/bundle/nsis/*-setup.exe'
              ;;
            macOS)
              require_bundle "macOS DMG" f '*/release/bundle/dmg/*.dmg'
              require_bundle "macOS app bundle" d '*/release/bundle/macos/*.app'
              ;;
            Linux)
              require_bundle "Linux DEB" f '*/release/bundle/deb/*.deb'
              require_bundle "Linux RPM" f '*/release/bundle/rpm/*.rpm'
              require_bundle "Linux AppImage" f '*/release/bundle/appimage/*.AppImage'
              ;;
            *)
              echo "::error::Unsupported runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: echoes-${{ matrix.name }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
